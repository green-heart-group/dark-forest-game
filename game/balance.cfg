	"dyson": [10, 0], "interstellar_probe": [8, 6], "warship": [10, 8], "bunker": [8, 4],
	"devourer": [16, 12], "grain": [20, 0], "gravity": [12, 4], "antimatter": [16, 0], "warp": [24, 8],
