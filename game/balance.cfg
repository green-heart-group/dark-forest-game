; 游戏的所有数值，方便边玩边调。大部分是暂定的（游戏设计 §12、§13），价格先由 AI 拟定，平衡模拟后再调。
; 调数值、加删数值都只改这个文件，不用改代码。代码里的声明（game/rules/balance.gd）由
; uv run game/tools/sync_balance.py 按这里生成，跑测试（uv run game/tools/test.py）时会自动先生成一遍。
;
; 格式是 Godot 的 ConfigFile：每行「名字 = 值」，分号后面是注释。本来是整数的数值不能写成小数（写 3，不写 3.0）。
; 调试面板里每个数值下面的说明取自注释：先看同一行后面的注释；没有的话，取上面连着几行的注释，
; 它算作下面连着的一组数值共同的说明，直到空行为止。以「---」开头的注释是分段标题，不算说明。

