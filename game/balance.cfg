TIER_GAP = 8
; II 级的「接触」：自己的舰船和别人的舰船相距这么近（E8）
CONTACT_RANGE = 1.0
; AI 每回合不花资源直接得到一项能升的科技的机会（技术爆炸，D6）
TECH_BURST_CHANCE = 0.02

