; 游戏的所有数值，方便边玩边调。大部分是暂定的（游戏设计 §12、§13），价格先由 AI 拟定，平衡模拟后再调。
; 调数值、加删数值都只改这个文件，不用改代码。代码里的声明（game/rules/balance.gd）由
; uv run game/tools/sync_balance.py 按这里生成，跑测试（uv run game/tools/test.py）时会自动先生成一遍。
;
; 格式是 Godot 的 ConfigFile：每行「名字 = 值」，分号后面是注释。本来是整数的数值不能写成小数（写 3，不写 3.0）。
; 调试面板里每个数值下面的说明取自注释：先看同一行后面的注释；没有的话，取上面连着几行的注释，
; 它算作下面连着的一组数值共同的说明，直到空行为止。以「---」开头的注释是分段标题，不算说明。

[values]

AI_COUNT = 4                ; 除了玩家，还有几个电脑控制的文明

; ---------- 星图生成（按 E7F6 的设想，概率都是暂定） ----------
; 一个格子 1 光年见方，最多一个星系。
P_HAS_STAR = 0.55           ; α：一个格子有星系的概率
STAR_WEIGHTS = [6, 3, 1]    ; β：单星、双星、三星的比例（E7F6 估计 6:3:1 或 7:2:1）
MAX_PLANETS = [8, 5, 3]     ; 单星、双星、三星系统最多几颗行星（0 到这个数随机）
P_ROCKY = 0.5               ; γ：一颗行星是类地行星（不是类木行星）的概率
P_HABITABLE_PLANET = 0.1    ; δ：一颗类地行星宜居的概率
HOME_MIN_DISTANCE = 5.0     ; 各文明的母星系彼此至少隔开几格（E7F6 2026-10-07 第三次）

; ---------- 资源和行动点 ----------
START_ENERGY = 20
START_MINERAL = 20
; 裂变能（科技 002）：自己星系里的每颗类地行星每回合多少能量（E7F6 2026-10-06 第二次：+1）
FISSION_ENERGY = 1
; 每个星系本身的能量：每个星系 ENERGY_PER_SYSTEM，再加每颗恒星 ENERGY_PER_STAR
; （E7F6 2026-10-06 第二次：只按恒星算，每颗 3E）
ENERGY_PER_SYSTEM = 0
ENERGY_PER_STAR = 3
MINERAL_PER_COLONY = 2      ; 每个星系本身每回合的矿石
; 行动点 = ACTION_BASE − 母星系的恒星数，每多一个殖民地 +1（E2），最少 ACTION_MIN
ACTION_BASE = 6
ACTION_MIN = 2
; 星系全丢了、只剩星舰时每回合的收入
STARSHIP_ENERGY = 2
STARSHIP_MINERAL = 1

