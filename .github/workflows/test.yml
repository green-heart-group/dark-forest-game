# 跑测试：开 PR、往 PR 里推新提交、合并进 master 时，跑规则测试和画面测试。
# master 的保护规则要求这里的 tests 通过才能合并（见 docs/decisions/0003-github-flow.md）。
# 所以不按改了哪些文件过滤：只改文档的 PR 也要跑，不然一直等不到结果、合并不了。
name: 测试

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 Godot
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

      - uses: astral-sh/setup-uv@v6

      # 和发布时一样带上字体，画面测试量出来的字宽才和网页版一致
      - name: 做网页版带的字体
        run: uv run game/tools/make_web_fonts.py

      - name: 导入并跑测试
        run: |
          godot --headless --path game --import
          godot --headless --path game --script res://tests/run_tests.gd
          godot --headless --path game --script res://tests/run_view_tests.gd
          godot --headless --path game --script res://tests/run_unfolding_tests.gd
