# 发布游戏：推送 v 开头的标签（如 v0.1.0）时，跑测试，导出 Windows、macOS 和网页版，
# 把桌面版 ZIP 挂到 Release 页面，网页版发到 GitHub Pages。
# exe 和网页版各有一个开发者版（一打开就有调试面板）：dark-forest-windows-dev.zip 和网页的 /dev/。
# 标签里带「-」（如 v0.1.0-test）的算试用版：Release 标成预发布。
# 也可以在 Actions 页面手动运行：只跑测试和导出，结果在运行页面底部下载，不发布。
name: 发布

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release
  pages: write      # 发布网页版
  id-token: write   # 发布网页版时 GitHub 要用

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          export-templates: "true"

      - name: 导入并跑测试
        run: uv run game/tools/test.py

      - name: 导出
        run: uv run game/tools/export.py

      - name: 保存导出结果（运行页面底部可下载）
        uses: actions/upload-artifact@v4
        with:
          name: dark-forest-${{ github.ref_name }}
          path: |
            build/dark-forest-windows.zip
            build/dark-forest-windows-dev.zip
            build/dark-forest-macos-intel.zip
            build/dark-forest-macos-apple-silicon.zip
            build/web

      - name: 发 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          case "$GITHUB_REF_NAME" in *-*) flag="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" build/dark-forest-windows.zip build/dark-forest-windows-dev.zip build/dark-forest-macos-intel.zip build/dark-forest-macos-apple-silicon.zip --generate-notes $flag

      - name: 准备网页版
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
